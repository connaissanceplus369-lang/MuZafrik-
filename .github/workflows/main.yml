name: Build APK debug
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Decompresser le projet
        run: |
          test -f MuZafrik.zip || { echo "MuZafrik.zip manque a la racine"; exit 1; }
          mkdir project
          unzip -q MuZafrik.zip -d project
      - name: Compiler
        working-directory: project
        run: gradle assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: MuZafrik-debug-apk
          path: project/app/build/outputs/apk/debug/*.apk
